

services:
  # Service 1: The RAG API (FastAPI + LlamaIndex)
  # Now connects to host Ollama instead of containerized version
  rag-api:
    build: ./app
    ports:
      - "8001:8001"
    depends_on:
      - chromadb
    env_file:
      - .env
    volumes:
      - ./data:/app/data  # Map local data folder into the container
    container_name: rag_api_service
    # Use host network mode to access host's Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Service 2: The Persistent Vector DB
  chromadb:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      # Persistent storage for vector embeddings
      - ./chroma_data:/chroma/chroma 
    container_name: chromadb_service

# Note: Ollama service removed - using system Ollama at http://host.docker.internal:11434
