services:
  rag-api:
    build:
      context: ./app
      args:
        UID: ${UID:-502}
        GID: ${GID:-20}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      chromadb:
        condition: service_healthy
    image: talkback-refactor-rag-api
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
      # Empty keeps the in-process reranker. A Mac sets this to the host MPS service.
      RERANK_URL: ${RERANK_URL:-}
    volumes:
      # Writable library. Drop a file saves into ./data.
      # - ./data:/app/data
      # Read-only demo folder. Set LIBRARY_READ_ONLY=true with this mount.
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/app/data:ro
      - ./hf_cache:/home/appuser/.cache
      # Named volume: SQLite on the Docker VM disk, not a macOS bind mount.
      - talkback_status:/app/status
    container_name: rag_api_service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  indexer:
    build:
      context: ./app
      args:
        UID: ${UID:-502}
        GID: ${GID:-20}
    image: talkback-refactor-rag-api
    depends_on:
      chromadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
      # Optional scheduled incremental index (minutes). Leave unset to keep it off.
      # REINDEX_INTERVAL_MINUTES: "30"
    volumes:
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env}:/app/data:ro
      - ./hf_cache:/home/appuser/.cache
      - talkback_status:/app/status
    command: ["python", "-m", "ingestion.worker"]
    container_name: rag_indexer_service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib, time; age = time.time() - float(pathlib.Path('/tmp/talkback-indexer-heartbeat').read_text()); assert age < 30, age",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  chromadb:
    image: chromadb/chroma
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    # Not published. The API uses chromadb:8000 on the compose network.
    # To inspect it from this machine only: "127.0.0.1:8002:8000"
    volumes:
      # This image keeps its database in /data. A mount on /chroma/chroma is ignored.
      - ./chroma_data:/data
    container_name: chromadb_service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

# Ollama runs on the host at http://host.docker.internal:11434

volumes:
  talkback_status:
