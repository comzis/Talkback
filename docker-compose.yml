services:
  rag-api:
    build:
      context: ./app
      args:
        UID: ${UID:-502}
        GID: ${GID:-20}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      chromadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/sentence-transformers
    volumes:
      # Writable library used by Drop a file. For the Mac demo, mount a local
      # folder read-only and set LIBRARY_READ_ONLY=true:
      #   - ~/TalkbackDemo:/app/data:ro
      # Optional scheduled incremental index (minutes). Leave unset to keep it off:
      #   REINDEX_INTERVAL_MINUTES=30
      - ./data:/app/data
      - ./hf_cache:/home/appuser/.cache
    container_name: rag_api_service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  chromadb:
    image: chromadb/chroma
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    # Not published. The API uses chromadb:8000 on the compose network.
    # To inspect it from this machine only: "127.0.0.1:8002:8000"
    volumes:
      # This image keeps its database in /data. A mount on /chroma/chroma is ignored.
      - ./chroma_data:/data
    container_name: chromadb_service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

# Ollama runs on the host at http://host.docker.internal:11434
