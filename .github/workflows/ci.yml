name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: |
          python -m pip install --no-cache-dir torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r app/requirements.txt
          python -c "import importlib.util, torch; print(torch.__version__); banned=[name for name in ('nvidia', 'nvidia_cublas', 'nvidia_cuda_runtime') if importlib.util.find_spec(name)]; assert not banned, banned"
          python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt_tab')"
      - name: Install lint and test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app scripts
      - name: Format
        run: ruff format --check app scripts
      - name: Unit tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: python -m pytest
